[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "excel-data-parser"
version = "0.1.0"
description = "Read-only OOXML extraction and traceable financial planning data normalization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
excel-parser = "excel_parser.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
