name: 작업
description: 리팩터링·문서·테스트·설정 등 기타 작업
title: "[타입] "
body:
  - type: dropdown
    id: area
    attributes:
      label: 영역
      options:
        - fe
        - be
        - ai
        - parser
        - docs
        - common (루트 설정 / 여러 영역)
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: 타입
      options:
        - refactor
        - style
        - docs
        - test
        - chore
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 작업 내용
      placeholder: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 참고 (선택)
