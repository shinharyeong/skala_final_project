name: 기능
description: 새 기능 추가 또는 기존 기능 개선
title: "[feat] "
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: 영역
      options:
        - fe
        - be
        - ai
        - parser
        - docs
        - common (루트 설정 / 여러 영역)
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: 배경
      description: 왜 필요한가요?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 작업 내용
      placeholder: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 기준
      description: 무엇이 되면 이 이슈를 닫을 수 있나요?
  - type: textarea
    id: notes
    attributes:
      label: 참고 (선택)
      description: 관련 문서, 이슈, 화면 등
